name: Website

# Publishes the website on GitHub Pages on every push to main (and by hand): builds inicia.exe on
# Windows, assembles the site around it (web/assemble.sh: pages, catalog, icons, generated pages,
# and the exe the download buttons serve), and deploys it. The exe sits on the same origin as the
# pages, which the download attribute's file names need.
#
# Pages has to be set to "GitHub Actions" in the repository's settings (Settings > Pages > Source).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  exe:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build inicia.exe
        uses: ./.github/actions/build-exe

      - name: Keep inicia.exe for the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: inicia-exe
          path: target/inicia.exe
          if-no-files-found: error

  site:
    needs: exe
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get inicia.exe
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: inicia-exe
          path: ${{ runner.temp }}/exe

      - name: Check and assemble the site
        run: |
          tools/check-site.py
          web/assemble.sh "$RUNNER_TEMP/exe/inicia.exe"
          test -f target/web/inicia.exe

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload the site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/web

  deploy:
    needs: site
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
